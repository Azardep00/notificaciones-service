spring.application.name=notificaciones-service
server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------------------------------------------------------
# Kafka (rama feature/kafka - objetivo de aprendizaje)
# -------------------------------------------------------------------
# Este servicio se suscribe al topico donde el API core publica los
# cambios de estado de pedido. El endpoint REST sigue existiendo para
# no romper el camino anterior.
notificaciones.kafka.topico=pedidos.estado-cambiado

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=notificaciones
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Productor y consumidor son proyectos distintos: se ignora la cabecera de
# tipo del mensaje y se mapea siempre a la clase local equivalente.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.tamaleslechona.notificacionesservice.dto.PedidoEstadoEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tamaleslechona.*

# No tumbar el arranque si el broker todavia no esta listo.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=2s

spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USER:x}" password="${KAFKA_PASS:x}";
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH:/etc/secrets/ca.pem}